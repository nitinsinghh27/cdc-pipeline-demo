version: "3.8"

# =============================================================================
# Local CDC Demo Stack
#
# Pipeline:
#   MySQL → Debezium/Kafka Connect → Redpanda
#     → Consumer (writes CDC events as JSON to MinIO/S3)
#       → Loader  (polls MinIO, applies events to PostgreSQL)  ← Snowpipe pattern
#
# Monitoring: Prometheus + Grafana (dashboards + alerts) + Loki (container logs)
#
# Quick start:
#   docker-compose up -d
#   bash setup.sh          ← registers Debezium connector
#   python ../main.py --env local
# =============================================================================

services:

  # ── Source: MySQL 8 with binlog enabled ─────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: demo-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: demo_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_pass
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_pass"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Message Broker: Redpanda (Kafka-compatible, no Zookeeper) ────────────────
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.11
    container_name: demo-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "512M"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
      - --pandaproxy-addr
      - 0.0.0.0:8082
      - --advertise-pandaproxy-addr
      - redpanda:8082
      - --set
      - redpanda.enable_transactions=true
      - --set
      - redpanda.enable_idempotence=true
    ports:
      - "9092:9092"
      - "9644:9644"   # Admin API + Prometheus metrics
      - "8082:8082"   # REST proxy
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy.*true' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ── CDC Engine: Debezium Kafka Connect ───────────────────────────────────────
  kafka-connect:
    image: debezium/connect:2.4
    container_name: demo-kafka-connect
    depends_on:
      mysql:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      GROUP_ID: connect-cluster
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONNECT_REPLICATION_FACTOR: "1"
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_LOG4J_LOGGERS: "io.debezium=INFO,org.apache.kafka.connect=INFO"
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 12

  # ── Object Storage: MinIO (S3-compatible) ────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: demo-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"   # S3 API (boto3 endpoint)
      - "9001:9001"   # MinIO Console (web UI)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO init: creates buckets on first start ───────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: demo-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/cdc-events;
        mc mb --ignore-existing local/cdc-processed;
        echo 'MinIO buckets ready.';
        exit 0;
      "

  # ── CDC Consumer: Redpanda → MinIO (writes raw JSON events) ─────────────────
  consumer:
    build:
      context: ./consumer
    container_name: demo-consumer
    depends_on:
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      TOPIC_PREFIX: demo
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: cdc-events
    restart: unless-stopped

  # ── CDC Loader: MinIO → PostgreSQL (Snowpipe-style loader) ───────────────────
  loader:
    build:
      context: ./loader
    container_name: demo-loader
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: cdc-events
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: staging_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_pass
      POLL_INTERVAL_SECONDS: "5"
    restart: unless-stopped

  # ── Data Warehouse: PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: demo-postgres
    environment:
      POSTGRES_DB: staging_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_pass
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Metrics: Prometheus ──────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: demo-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"

  # ── Monitoring: Grafana ──────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.2.3
    container_name: demo-grafana
    depends_on:
      - prometheus
      - loki
      - postgres
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ── Log Aggregation: Loki ────────────────────────────────────────────────────
  loki:
    image: grafana/loki:2.9.3
    container_name: demo-loki
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"

  # ── Log Shipper: Promtail ────────────────────────────────────────────────────
  promtail:
    image: grafana/promtail:2.9.3
    container_name: demo-promtail
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./loki/promtail-config.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

volumes:
  mysql-data:
  postgres-data:
  minio-data:
  prometheus-data:
  grafana-data:
  loki-data:
